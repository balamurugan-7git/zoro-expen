<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoro Expense Tracker | Extreme Edition</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#39ff14">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
</head>

<body>
    <div class="app-background"></div>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="glass-sidebar">
            <div class="logo">
                <i class="fa-solid fa-khanda"></i>
                <span>Zoro Finance</span>
            </div>

            <ul class="nav-links">
                <li class="active" data-view="dashboard">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </li>
                <li data-view="transactions">
                    <i class="fa-solid fa-money-bill-transfer"></i>
                    <span>Transactions</span>
                </li>
                <li data-view="habits">
                    <i class="fa-solid fa-table-cells"></i>
                    <span>Habit Grid</span>
                </li>
                <li data-view="journal">
                    <i class="fa-solid fa-book-journal-whills"></i>
                    <span>Financial Notes</span>
                </li>
                <li data-view="analytics">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Analytics</span>
                </li>
                <li data-view="future">
                    <i class="fa-solid fa-eye"></i>
                    <span>Future Plans</span>
                </li>
            </ul>

            <button class="add-habit-btn-sidebar" id="sidebarAddBtn">
                <i class="fa-solid fa-plus"></i> Add Transaction
            </button>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="glass-header">
                <div class="header-text">
                    <h1 id="pageTitle">Command Center</h1>
                    <p id="pageSubtitle">Master your wealth like a swordsman.</p>
                </div>
                <div class="header-actions">
                    <div class="asset-pill" onclick="AppState.editTotalAssets()">
                        <i class="fa-solid fa-wallet"></i>
                        <span id="totalAssetsDisplay">₹ 0.00</span>
                    </div>
                    <div class="date-display" id="currentDate">Mon, Jan 01</div>
                    <div class="user-avatar">
                        <i class="fa-solid fa-user-ninja"></i>
                    </div>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <div id="viewContainer" class="view-container">
                <!-- Views will be injected here by JS -->
            </div>
        </main>
    </div>

    <!-- Login Overlay -->
    <div id="loginOverlay" class="login-overlay">
        <div class="glass-login-card">
            <div class="login-logo">
                <i class="fa-solid fa-khanda"></i>
                <span>Zoro Finance</span>
            </div>
            <p style="color:var(--text-secondary); margin-bottom: 2rem;">Master your wealth. Conquer your future.</p>

            <button class="login-btn google-btn" id="googleLoginBtn">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Sign in with Google
            </button>
            <button class="login-btn quest-btn" id="questModeBtn">
                <i class="fa-solid fa-compass"></i> Quest Mode
                <span class="quest-badge">Explore</span>
            </button>
        </div>
    </div>

    <!-- Modals -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="glass-modal">
            <div class="modal-header">
                <h2 id="modalTitle">New Transaction</h2>
                <button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Transaction Form -->
            <form id="addTransactionForm">
                <div class="transaction-type-switcher">
                    <button type="button" class="type-btn active" data-type="expense">Expense</button>
                    <button type="button" class="type-btn" data-type="income">Income</button>
                    <button type="button" class="type-btn" data-type="future">Future</button>
                    <input type="hidden" id="transactionType" value="expense">
                </div>

                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="transAmount" placeholder="0.00" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="transDesc" placeholder="e.g. New Katana" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <div class="category-select" id="categorySelect">
                        <!-- Injected by JS based on Type -->
                    </div>
                    <input type="hidden" id="selectedCategory" required>
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="transDate" required>
                </div>

                <div class="form-group notes-group hidden" id="futureNotesGroup">
                    <label>Notes (Optional)</label>
                    <textarea id="transNotes" rows="3"
                        placeholder="Add details about this planned expense..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel close-modal">Cancel</button>
                    <button type="submit" class="btn-primary" id="modalSubmitBtn">Execute</button>
                </div>
            </form>

            <!-- Note Form (Hidden by default, used for Notes Tab) -->
            <form id="addNoteForm" class="hidden">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="noteTitle" placeholder="e.g. Investment Strategy" required>
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <textarea id="noteContent" rows="5" placeholder="Write your details here..." required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel close-modal">Cancel</button>
                    <button type="submit" class="btn-primary">Save Note</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
